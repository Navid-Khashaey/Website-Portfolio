<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <section id="experience" class="container">
        <h2 class="text-center mb-4">My Experience</h2>

        <div class="row justify-content-center">
            <!-- Frontend Development -->
            <div class="col-md-4 mb-4">
                <div class="card p-4 skill-category text-center">
                    <h4>Frontend Development</h4>
                    <div class="my-3">
                        <img src="images/html.png" alt="HTML" class="skill-icon">
                        <p><strong>HTML</strong><br><span class="text-muted">Proficient</span></p>
                    </div>
                    <div class="my-3">
                        <img src="images/css.png" alt="CSS" class="skill-icon">
                        <p><strong>CSS</strong><br><span class="text-muted">Intermediate</span></p>
                    </div>
                    <div class="my-3">
                        <img src="images/bootstrap.png" alt="Bootstrap" class="skill-icon">
                        <p><strong>Bootstrap</strong><br><span class="text-muted">Intermediate</span></p>
                    </div>
                </div>
            </div>

            <!-- Backend Development -->
            <div class="col-md-4 mb-4">
                <div class="card p-4 skill-category text-center">
                    <h4>Backend Development</h4>
                    <div class="my-3">
                        <img src="images/python-logo-only.png" alt="Python" class="skill-icon">
                        <p><strong>Python</strong><br><span class="text-muted">Proficient</span></p>
                    </div>
                    <div class="my-3">
                        <img src="images/Java-logo.png" alt="Java" class="skill-icon">
                        <p><strong>Java</strong><br><span class="text-muted">Intermediate</span></p>
                    </div>
                    <div class="my-3">
                        <img src="images/php.png" alt="PHP" class="skill-icon">
                        <p><strong>PHP</strong><br><span class="text-muted">Intermediate</span></p>
                    </div>
                </div>
            </div>

            <!-- Software & Game Development -->
            <div class="col-md-4 mb-4">
                <div class="card p-4 skill-category text-center">
                    <h4>Software & Game Development</h4>
                    <div class="my-3">
                        <img src="images/csharp.png" alt="C#" class="skill-icon">
                        <p><strong>C#</strong><br><span class="text-muted">Proficient</span></p>
                    </div>
                    <div class="my-3">
                        <img src="images/cpp.png" alt="C++" class="skill-icon">
                        <p><strong>C++</strong><br><span class="text-muted">Intermediate</span></p>
                    </div>
                    <div class="my-3">
                        <img src="images/python-logo-only.png" alt="Python" class="skill-icon">
                        <p><strong>Python</strong><br><span class="text-muted">Intermediate</span></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
