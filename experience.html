<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <section id="experience" class="container">
    <h2 class="text-center mb-4">My Experience</h2>

    <!-- Frontend Development -->
    <div class="skill-card">
        <h4 class="text-center mb-4">Frontend Development</h4>
        <div class="d-flex flex-wrap justify-content-center">
            <div class="text-center mx-4 skill-item">
                <img src="images/html.png" alt="HTML">
                <p>HTML</p>
                <p class="proficiency">Proficient</p>
            </div>
            <div class="text-center mx-4 skill-item">
                <img src="images/css.png" alt="CSS">
                <p>CSS</p>
                <p class="proficiency">Proficient</p>
            </div>
            <div class="text-center mx-4 skill-item">
                <img src="images/bootstrap.png" alt="Bootstrap">
                <p>Bootstrap</p>
                <p class="proficiency">Intermediate</p>
            </div>
        </div>
    </div>

    <!-- Backend Development -->
    <div class="skill-card">
        <h4 class="text-center mb-4">Backend Development</h4>
        <div class="d-flex flex-wrap justify-content-center">
            <div class="text-center mx-4 skill-item">
                <img src="images/python-logo-only.png" alt="Python">
                <p>Python</p>
                <p class="proficiency">Proficient</p>
            </div>
            <div class="text-center mx-4 skill-item">
                <img src="images/Java-logo.png" alt="Java">
                <p>Java</p>
                <p class="proficiency">Intermediate</p>
            </div>
            <div class="text-center mx-4 skill-item">
                <img src="images/html.png" alt="HTML">
                <p>PHP</p>
                <p class="proficiency">Intermediate</p>
            </div>
             <div class="text-center mx-4 skill-item">
                <img src="images/php.png" alt="PHP">
                <p>PHP</p>
                <p class="proficiency">Intermediate</p>
            </div>
        </div>
    </div>
</section>

</body>
</html>
